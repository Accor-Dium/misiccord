<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misiccord</title>
<meta name="description" content="Música de YouTube Music, letras sincronizadas y jams para escuchar juntos.">
<style>
  :root { --fondo: #0a0f14; --texto: #e6edf3; --tenue: #8193a3; --cian: #22d3ee; --morado: #a78bfa; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; text-align: center;
    background: radial-gradient(120% 80% at 50% 0%, #10303a 0%, var(--fondo) 60%); color: var(--texto);
    font-family: "Inter", system-ui, -apple-system, Roboto, "Segoe UI", sans-serif;
  }
  main { width: min(420px, 100%); }
  h1 { margin: 0 0 8px; font-size: 34px; letter-spacing: -0.5px; }
  p { margin: 0 0 24px; color: var(--tenue); line-height: 1.5; }
  a { display: inline-flex; height: 52px; padding: 0 28px; align-items: center; border-radius: 999px; background: var(--cian); color: #04121a; font-weight: 800; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>Misiccord</h1>
  <p>Música de YouTube Music, letras sincronizadas y jams para escuchar juntos. Para Windows y Android.</p>
  <a href="https://github.com/Accor-Dium/misiccord/releases/latest">Descargar</a>
</main>
</body>
</html>
